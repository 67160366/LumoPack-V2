<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DXF Dieline Plot Analyzer</title>
    <style>
        body { background: #1e1e24; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        svg { background: #2b2b36; border: 1px solid #444; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .legend { margin-top: 15px; display: flex; gap: 20px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .box { width: 15px; height: 15px; display: inline-block; }
    </style>
</head>
<body>
    <h2>DXF Blueprint Coordinates (500 x 300 x 80 mm)</h2>
    
    <svg width="800" height="700" viewBox="-250 -150 1100 1000">
        <g transform="translate(0, 800) scale(1, -1)">
            
            <line x1="-250" y1="0" x2="850" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
            <line x1="0" y1="-150" x2="0" y2="850" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

            <line x1="-200" y1="-80" x2="700" y2="-80" stroke="#22aa44" stroke-width="1.5" stroke-dasharray="8,8"/>
            <line x1="-200" y1="386" x2="700" y2="386" stroke="#22aa44" stroke-width="1.5" stroke-dasharray="8,8"/>
            <line x1="-200" y1="696.5" x2="700" y2="696.5" stroke="#22aa44" stroke-width="1.5" stroke-dasharray="8,8"/>
            <line x1="509" y1="-100" x2="509" y2="800" stroke="#22aa44" stroke-width="1.5" stroke-dasharray="8,8"/>
            <line x1="-83" y1="-100" x2="-83" y2="800" stroke="#22aa44" stroke-width="1.5" stroke-dasharray="8,8"/>
            <line x1="604" y1="-100" x2="604" y2="800" stroke="#22aa44" stroke-width="1.5" stroke-dasharray="8,8"/>

            <rect x="-83" y="-80" width="687" height="80" fill="rgba(204, 34, 34, 0.1)" stroke="#cc2222" stroke-width="3"/>
            
            <rect x="0" y="0" width="509" height="306" fill="rgba(255, 255, 255, 0.05)" stroke="#cc2222" stroke-width="3"/>
            
            <rect x="-178" y="0" width="184" height="306" fill="rgba(204, 34, 34, 0.1)" stroke="#cc2222" stroke-width="3"/>
            
            <rect x="509" y="0" width="190" height="306" fill="rgba(204, 34, 34, 0.1)" stroke="#cc2222" stroke-width="3"/>
            
            <rect x="-83" y="306" width="687" height="472" fill="rgba(204, 34, 34, 0.1)" stroke="#cc2222" stroke-width="3"/>

            <rect x="0" y="53" width="10.5" height="60" fill="#00aaff" stroke="#00aaff" stroke-width="2"/>
            <rect x="510.5" y="53" width="10.5" height="60" fill="#00aaff" stroke="#00aaff" stroke-width="2"/>
            <rect x="0" y="193" width="10.5" height="60" fill="#00aaff" stroke="#00aaff" stroke-width="2"/>
            <rect x="510.5" y="193" width="10.5" height="60" fill="#00aaff" stroke="#00aaff" stroke-width="2"/>

        </g>

        <text x="30" y="790" fill="rgba(255,255,255,0.5)" font-size="14">Origin (0,0)</text>
        <text x="220" y="600" fill="#fff" font-size="18" font-weight="bold">Base (W:500 x D:306)</text>
        <text x="220" y="840" fill="#fff" font-size="16">Front Wall (H:80)</text>
        <text x="-160" y="640" fill="#fff" font-size="16" transform="rotate(-90 -160 640)">Left Wall (Depth)</text>
        <text x="220" y="300" fill="#fff" font-size="18" font-weight="bold">Top Lid + Back Wall</text>
        
        <text x="-40" y="890" fill="#22aa44" font-size="14">Y: -80</text>
        <text x="-40" y="500" fill="#22aa44" font-size="14">Y: 306</text>
        <text x="-40" y="420" fill="#22aa44" font-size="14">Y: 386</text>
        <text x="-40" y="110" fill="#22aa44" font-size="14">Y: 696</text>
    </svg>

    <div class="legend">
        <div class="legend-item"><span class="box" style="background: rgba(204, 34, 34, 0.2); border: 2px solid #cc2222;"></span> ขอบเขตเส้นตัด (Cut Lines)</div>
        <div class="legend-item"><span class="box" style="background: repeating-linear-gradient(45deg, transparent, transparent 5px, #22aa44 5px, #22aa44 10px);"></span> รอยพับ (Crease)</div>
        <div class="legend-item"><span class="box" style="background: #00aaff;"></span> ร่องเสียบล็อก (Slots)</div>
    </div>
</body>
</html>
