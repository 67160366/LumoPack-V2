<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Resizable Sequential Mailer Box</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #f8fafc 0%, #cbd5e1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            color: #1e293b;
            z-index: 10;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 320px;
            max-height: 90vh;
            overflow-y: auto;
        }
        label { 
            display: flex; 
            justify-content: space-between;
            margin-bottom: 8px; 
            font-weight: 700; 
            color: #0f172a; 
            font-size: 14px; 
        }
        .status { color: #10b981; font-weight: 600; }
        .val-text { color: #3b82f6; font-weight: 600; }
        
        input[type="range"] { 
            width: 100%; 
            cursor: pointer; 
            accent-color: #10b981; 
            height: 6px;
            border-radius: 4px;
            margin-bottom: 20px; 
        }
        .dim-slider { accent-color: #3b82f6 !important; }

        .steps {
            font-size: 12px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 15px;
            padding-left: 0;
            list-style: none;
        }
        .steps li::before {
            content: '•';
            color: #10b981;
            font-weight: bold;
            display: inline-block; 
            width: 1em;
            margin-left: -1em;
        }
        .active-step { color: #0f172a; font-weight: 600; }
        .hint {
            font-size: 12px; 
            color: #64748b; 
            margin: 0;
            text-align: center;
            background: rgba(0,0,0,0.04);
            padding: 8px;
            border-radius: 8px;
        }
        hr { border: 0; height: 1px; background: #e2e8f0; margin: 15px 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-container">
        <label>
            <span>ลำดับการพับกล่อง</span>
            <span id="percent-label" class="status">0%</span>
        </label>
        <input type="range" id="fold-slider" min="0" max="100" step="0.5" value="0">
        
        <label>กว้าง (Width): <span id="w-val" class="val-text">3.0</span></label>
        <input type="range" class="dim-slider" id="w-slider" min="1.5" max="5.0" step="0.1" value="3.0">

        <label>ยาว (Depth): <span id="d-val" class="val-text">2.0</span></label>
        <input type="range" class="dim-slider" id="d-slider" min="1.0" max="4.0" step="0.1" value="2.0">

        <label>สูง (Height): <span id="h-val" class="val-text">1.0</span></label>
        <input type="range" class="dim-slider" id="h-slider" min="0.5" max="2.5" step="0.1" value="1.0">
        
        <hr>

        <ul class="steps" id="step-list">
            <li id="step-1" class="active-step">1. กางกล่องแบนราบ (Flat)</li>
            <li id="step-2">2. ตั้งผนังด้านข้าง (Side Walls)</li>
            <li id="step-3">3. พับปีกยึดด้านข้าง (Side Flaps)</li>
            <li id="step-4">4. พับผนังหน้า-หลัง (Front & Back)</li>
            <li id="step-5">5. พับปีกฝากล่อง (Dust Flaps)</li>
            <li id="step-6">6. ปิดฝากล่อง (Lid)</li>
            <li id="step-7">7. เสียบตัวล็อค (Tuck In)</li>
        </ul>
        
        <p class="hint">🖱️ ลากซ้าย-ขวา เพื่อหมุนดูรอบๆ</p>
    </div>

    <script>
        // --- 1. Setup Scene ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 5, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        // --- 2. Lighting ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 25;
        scene.add(dirLight);
        
        const fillLight = new THREE.DirectionalLight(0xffedd5, 0.4);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        // --- 3. Floor ---
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(50, 50),
            new THREE.ShadowMaterial({ opacity: 0.12 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.05;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 4. Materials ---
        const matCardboard = new THREE.MeshStandardMaterial({ 
            color: 0xdfb48c, side: THREE.DoubleSide, roughness: 0.9 
        });
        const edgeColor = 0xb48255;

        // --- 5. Global Variables for Groups ---
        let boxMaster = new THREE.Group();
        scene.add(boxMaster);

        let leftGroup, rightGroup, frontGroup, backGroup, lidGroup, tuckGroup;
        let leftFrontTabGroup, leftBackTabGroup, rightFrontTabGroup, rightBackTabGroup;
        let leftEarGroup, rightEarGroup;

        // Helper สร้างชิ้นส่วน
        function createPart(shape) {
            const geo = new THREE.ShapeGeometry(shape);
            const mesh = new THREE.Mesh(geo, matCardboard);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.rotation.x = -Math.PI / 2; 
            
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: edgeColor, linewidth: 1, opacity: 0.5, transparent: true }));
            mesh.add(line);
            
            return mesh;
        }

        // --- 6. ฟังก์ชันสร้างกล่องตามขนาดที่กำหนด ---
        function buildBox(W, D, H) {
            // เคลียร์กล่องเก่าทิ้งก่อน (ป้องกัน Memory Leak)
            boxMaster.traverse((child) => {
                if (child.isMesh || child.isLineSegments) {
                    if (child.geometry) child.geometry.dispose();
                }
            });
            boxMaster.clear();

            // [1] Base
            const baseShape = new THREE.Shape();
            baseShape.moveTo(-W/2, -D/2); baseShape.lineTo(W/2, -D/2);
            baseShape.lineTo(W/2, D/2); baseShape.lineTo(-W/2, D/2);
            boxMaster.add(createPart(baseShape));

            // [2] Back Wall
            const backShape = new THREE.Shape();
            backShape.moveTo(-W/2, 0); backShape.lineTo(W/2, 0);
            backShape.lineTo(W/2, H); backShape.lineTo(-W/2, H);
            backGroup = new THREE.Group();
            backGroup.position.set(0, 0, -D/2); 
            backGroup.add(createPart(backShape));
            boxMaster.add(backGroup);

            // [3] Front Wall
            const frontShape = new THREE.Shape();
            frontShape.moveTo(-W/2, 0); frontShape.lineTo(W/2, 0);
            frontShape.lineTo(W/2, -H); frontShape.lineTo(-W/2, -H);
            frontGroup = new THREE.Group();
            frontGroup.position.set(0, 0, D/2); 
            frontGroup.add(createPart(frontShape));
            boxMaster.add(frontGroup);

            // [4] Left Wall
            const leftShape = new THREE.Shape();
            leftShape.moveTo(0, -D/2); leftShape.lineTo(-H, -D/2);
            leftShape.lineTo(-H, D/2); leftShape.lineTo(0, D/2);
            leftGroup = new THREE.Group();
            leftGroup.position.set(-W/2, 0, 0); 
            leftGroup.add(createPart(leftShape));
            boxMaster.add(leftGroup);

            // [5] Right Wall
            const rightShape = new THREE.Shape();
            rightShape.moveTo(0, -D/2); rightShape.lineTo(H, -D/2);
            rightShape.lineTo(H, D/2); rightShape.lineTo(0, D/2);
            rightGroup = new THREE.Group();
            rightGroup.position.set(W/2, 0, 0); 
            rightGroup.add(createPart(rightShape));
            boxMaster.add(rightGroup);

            // --- Side Tabs ---
            const tabW = D * 0.48; 
            const tabH = H * 0.96; 
            const chamfer = 0.15;

            // ซ้าย-หน้า
            const lftShape = new THREE.Shape();
            lftShape.moveTo(0, 0); lftShape.lineTo(-tabH, 0);
            lftShape.lineTo(-tabH, -tabW + chamfer); lftShape.lineTo(-tabH + chamfer, -tabW); lftShape.lineTo(0, -tabW);
            leftFrontTabGroup = new THREE.Group();
            leftFrontTabGroup.position.set(0, 0, D/2 - 0.01); 
            leftFrontTabGroup.add(createPart(lftShape));
            leftGroup.add(leftFrontTabGroup);

            // ซ้าย-หลัง
            const lbtShape = new THREE.Shape();
            lbtShape.moveTo(0, 0); lbtShape.lineTo(-tabH, 0);
            lbtShape.lineTo(-tabH, tabW - chamfer); lbtShape.lineTo(-tabH + chamfer, tabW); lbtShape.lineTo(0, tabW);
            leftBackTabGroup = new THREE.Group();
            leftBackTabGroup.position.set(0, 0, -D/2 + 0.01);
            leftBackTabGroup.add(createPart(lbtShape));
            leftGroup.add(leftBackTabGroup);

            // ขวา-หน้า
            const rftShape = new THREE.Shape();
            rftShape.moveTo(0, 0); rftShape.lineTo(tabH, 0);
            rftShape.lineTo(tabH, -tabW + chamfer); rftShape.lineTo(tabH - chamfer, -tabW); rftShape.lineTo(0, -tabW);
            rightFrontTabGroup = new THREE.Group();
            rightFrontTabGroup.position.set(0, 0, D/2 - 0.01);
            rightFrontTabGroup.add(createPart(rftShape));
            rightGroup.add(rightFrontTabGroup);

            // ขวา-หลัง
            const rbtShape = new THREE.Shape();
            rbtShape.moveTo(0, 0); rbtShape.lineTo(tabH, 0);
            rbtShape.lineTo(tabH, tabW - chamfer); rbtShape.lineTo(tabH - chamfer, tabW); rbtShape.lineTo(0, tabW);
            rightBackTabGroup = new THREE.Group();
            rightBackTabGroup.position.set(0, 0, -D/2 + 0.01);
            rightBackTabGroup.add(createPart(rbtShape));
            rightGroup.add(rightBackTabGroup);

            // [6] Lid (ฝากล่อง)
            const lidShape = new THREE.Shape();
            lidShape.moveTo(-W/2, 0); lidShape.lineTo(W/2, 0);
            lidShape.lineTo(W/2, D); lidShape.lineTo(-W/2, D);
            lidGroup = new THREE.Group();
            lidGroup.position.set(0, 0, -H); 
            lidGroup.add(createPart(lidShape));
            backGroup.add(lidGroup);

            // [7] Tuck Flap (ปีกเสียบด้านหน้า)
            const tuckShape = new THREE.Shape();
            const tw = W * 0.96;
            const th = H * 0.6;  
            tuckShape.moveTo(-tw/2, 0); 
            tuckShape.lineTo(tw/2, 0);
            tuckShape.lineTo(tw/2 - 0.1, th - 0.1); 
            tuckShape.quadraticCurveTo(tw/2 - 0.15, th, tw/2 - 0.3, th); 
            tuckShape.lineTo(-tw/2 + 0.3, th);
            tuckShape.quadraticCurveTo(-tw/2 + 0.15, th, -tw/2 + 0.1, th - 0.1);
            tuckGroup = new THREE.Group();
            tuckGroup.position.set(0, 0, -D); 
            tuckGroup.add(createPart(tuckShape));
            lidGroup.add(tuckGroup);

            // [8] Ears (ปีกกันฝุ่น)
            const earShapeLeft = new THREE.Shape();
            const ew = H * 0.85; 
            const e_start = D * 0.1;
            const e_end = D * 0.9;
            earShapeLeft.moveTo(0, e_start);
            earShapeLeft.lineTo(-ew + 0.1, e_start);
            earShapeLeft.quadraticCurveTo(-ew, e_start + 0.1, -ew, e_start + 0.3);
            earShapeLeft.lineTo(-ew, e_end - 0.3);
            earShapeLeft.quadraticCurveTo(-ew + 0.1, e_end, -ew + 0.3, e_end);
            earShapeLeft.lineTo(0, e_end);
            leftEarGroup = new THREE.Group();
            leftEarGroup.position.set(-W/2 + 0.03, 0, 0);
            leftEarGroup.add(createPart(earShapeLeft));
            lidGroup.add(leftEarGroup);

            const earShapeRight = new THREE.Shape();
            earShapeRight.moveTo(0, e_start);
            earShapeRight.lineTo(ew - 0.1, e_start);
            earShapeRight.quadraticCurveTo(ew, e_start + 0.1, ew, e_start + 0.3);
            earShapeRight.lineTo(ew, e_end - 0.3);
            earShapeRight.quadraticCurveTo(ew - 0.1, e_end, ew - 0.3, e_end);
            earShapeRight.lineTo(0, e_end);
            rightEarGroup = new THREE.Group();
            rightEarGroup.position.set(W/2 - 0.03, 0, 0);
            rightEarGroup.add(createPart(earShapeRight));
            lidGroup.add(rightEarGroup);
        }

        // --- 7. Animation Logic ---
        const foldSlider = document.getElementById('fold-slider');
        const percentLabel = document.getElementById('percent-label');
        const steps = document.querySelectorAll('.steps li');

        function getStage(p, start, end) {
            if (p <= start) return 0;
            if (p >= end) return 1;
            let t = (p - start) / (end - start);
            return t * t * (3 - 2 * t); 
        }

        function updateFold() {
            const p = parseFloat(foldSlider.value) / 100;
            percentLabel.innerText = Math.round(p * 100) + '%';

            // จัดการ UI
            steps.forEach((el, i) => el.className = '');
            if (p === 0) steps[0].className = 'active-step';
            else if (p > 0 && p < 0.15) steps[1].className = 'active-step';
            else if (p >= 0.15 && p < 0.30) steps[2].className = 'active-step';
            else if (p >= 0.30 && p < 0.45) steps[3].className = 'active-step';
            else if (p >= 0.45 && p < 0.60) steps[4].className = 'active-step';
            else if (p >= 0.60 && p < 0.80) steps[5].className = 'active-step';
            else if (p >= 0.80) steps[6].className = 'active-step';

            boxMaster.position.y = getStage(p, 0, 0.1) * 0.05; 

            // ควบคุมองศาการพับผ่าน Global Groups
            let sideFold = getStage(p, 0.05, 0.20) * (Math.PI / 2);
            leftGroup.rotation.z = -sideFold;
            rightGroup.rotation.z = sideFold;

            let tabFold = getStage(p, 0.20, 0.35) * (Math.PI / 2);
            leftFrontTabGroup.rotation.x = -tabFold;
            leftBackTabGroup.rotation.x = tabFold;
            rightFrontTabGroup.rotation.x = -tabFold;
            rightBackTabGroup.rotation.x = tabFold;

            let fbFold = getStage(p, 0.35, 0.50) * (Math.PI / 2);
            frontGroup.rotation.x = -fbFold; 
            backGroup.rotation.x = fbFold;

            let earFold = getStage(p, 0.50, 0.65) * (Math.PI / 1.95);
            leftEarGroup.rotation.z = -earFold; 
            rightEarGroup.rotation.z = earFold;

            let lidFold = getStage(p, 0.65, 0.85) * (Math.PI / 2 * 0.99);
            lidGroup.rotation.x = lidFold;

            let tuckFold = getStage(p, 0.85, 1.00) * (Math.PI / 2 * 0.98);
            tuckGroup.rotation.x = tuckFold;
        }

        // --- 8. UI Event Listeners ---
        const wSlider = document.getElementById('w-slider');
        const dSlider = document.getElementById('d-slider');
        const hSlider = document.getElementById('h-slider');
        
        const wVal = document.getElementById('w-val');
        const dVal = document.getElementById('d-val');
        const hVal = document.getElementById('h-val');

        function updateDimensions() {
            const W = parseFloat(wSlider.value);
            const D = parseFloat(dSlider.value);
            const H = parseFloat(hSlider.value);
            
            wVal.innerText = W.toFixed(1);
            dVal.innerText = D.toFixed(1);
            hVal.innerText = H.toFixed(1);

            buildBox(W, D, H); // สร้างทรงใหม่
            updateFold();      // อัปเดตองศาการพับปัจจุบันกลับเข้าไป
        }

        foldSlider.addEventListener('input', updateFold);
        wSlider.addEventListener('input', updateDimensions);
        dSlider.addEventListener('input', updateDimensions);
        hSlider.addEventListener('input', updateDimensions);

        // Initial Build
        updateDimensions();

        // --- 9. Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
